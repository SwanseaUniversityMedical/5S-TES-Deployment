name: SubmissionLayer

# ----- Services -----

include:
  # ----- Application Services -----
  # - (Submission Layer)
  - ../../ServiceStack/compose-manifests/applications/submission-layer.yml

  # ----- Shared Services -----
  # - Platform Service: (PostgreSQL, Adminer, Serilog, RabbitMQ)
  - ../../ServiceStack/compose-manifests/shared/platform.yml
  # - Auth Service: (Keycloak - Optional)
  - ../../ServiceStack/compose-manifests/shared/auth.yml

  # ----- Storage Services -----
  # - (RustFS S3 Submission)
  - ../../ServiceStack/compose-manifests/storage/s3-submission.yml

# ----- Volumes -----

volumes:
  postgresql_data:
    driver: local
  postgresql_kc:
    driver: local
  s3_submission_data:
    driver: local
  seq_data:
    driver: local
  rabbitdata:
    driver: local
  rabbitlogs:
    driver: local
  keycloak_data:
    driver: local
  data-protection:
    driver: local
  vault_data:
    driver: local
  vault_logs:
    driver: local

# ----- Shared Network & Configs -----

networks:
  sub-net:
    driver: bridge
