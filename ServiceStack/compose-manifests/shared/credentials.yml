services:
  # ------ Zeebe Workflow Engine ------
  # -----------------------------------------

  zeebe: # https://docs.camunda.io/docs/self-managed/platform-deployment/docker/#zeebe
    image: camunda/zeebe:8.2.0
    container_name: zeebe
    ports:
      - "127.0.0.1:26500:26500"
      - "127.0.0.1:9600:9600"
      - "127.0.0.1:8088:8080"
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=100
      - ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK=0.8
      - ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK=0.9
      - ZEEBE_BROKER_THREADS_CPUTHREADCOUNT=3
      - ZEEBE_BROKER_THREADS_IOTHREADCOUNT=3
      - "JAVA_TOOL_OPTIONS=-Xms1g -Xmx1g"
    mem_limit: 2g
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'",
        ]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - zeebe:/usr/local/zeebe/data
    networks:
      - sub-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ------ OpenLDAP Identity Provider ------
  # ---------------------------------------------

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_LOG_LEVEL: "256"
      LDAP_ORGANISATION: "TRE Ephemeral Credentials"
      LDAP_DOMAIN: "camundaephemeral.local"
      LDAP_ADMIN_PASSWORD: ${LDAPAdminPassword}
      LDAP_CONFIG_PASSWORD: ${LDAPConfigPassword}
      LDAP_TLS: "false"
      LDAP_ADD_LDIF_URL: "file:///container/service/slapd/assets/init.ldif"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ${CONFIG_PATH}/ldap-init/init.ldif:/container/service/slapd/assets/init.ldif
    ports:
      - "127.0.0.1:1389:389"
      - "127.0.0.1:1636:636"
    networks:
      - sub-net
    domainname: "camundaephemeral.local"
    hostname: "ldap.camundaephemeral.local"
    tty: true
    stdin_open: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost -b dc=camundaephemeral,dc=local -D 'cn=admin,dc=camundaephemeral,dc=local' -w ${LDAPAdminPassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------ LDAP Initialization Service ------
  # ---------------------------------------------

  ldap-init:
    image: osixia/openldap:1.5.0
    networks:
      - sub-net
    depends_on:
      openldap:
        condition: service_healthy
    entrypoint: >
      sh -c "
        for i in $(seq 1 30); do
          ldapsearch -x -H ldap://openldap -D 'cn=admin,dc=camundaephemeral,dc=local' -w '${LDAPAdminPassword}' -b 'dc=camundaephemeral,dc=local' && break
          sleep 2
        done
        ldapadd -x -H ldap://openldap -D 'cn=admin,dc=camundaephemeral,dc=local' -w '${LDAPAdminPassword}' -f /container/service/slapd/assets/init.ldif || true
      "
    volumes:
      - ${CONFIG_PATH}/ldap-init/init.ldif:/container/service/slapd/assets/init.ldif

  # ------ phpLDAPadmin Web Interface ------
  # ---------------------------------------------

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    networks:
      - sub-net
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - openldap

  # ------ Elasticsearch ------
  # -----------------------------------

  elasticsearch: # https://hub.docker.com/_/elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    container_name: elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # allow running with low disk space
      - cluster.routing.allocation.disk.threshold_enabled=false
      # Disable noisy deprecation logs, see https://github.com/camunda/camunda/issues/26285
      - logger.org.elasticsearch.deprecation="OFF"
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9200' || exit 1",
        ]
      interval: 5s
      retries: 60
      start_period: 60s
      timeout: 10s
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      - sub-net

