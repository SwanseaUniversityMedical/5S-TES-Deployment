services:
  # ----- Submission UI -----
  # -----------------------------------------
  submissionUI:
    image: harbor.federated-analytics.ac.uk/5s-tes/submission-ui:${DEPLOYMENT_VERSION}
    container_name: submissionUI
    restart: always
    networks:
      - sub-net
    ports:
      - 7220:8080
      - 8888:8080
    depends_on:
      - submissionAPI
    volumes:
      - data-protection:/root/.aspnet/DataProtection-Keys
    environment:
      - UIName__Name=${AppName}
      - KeycloakDemoMode=${KeyCloakDemoMode}
      - Serilog__SeqServerUrl=http://seq:5341
      - Serilog__MinimumLevel__Default=${SerilogLevel}
      - Logging__LogLevel__Default=${SerilogLevel}
      - KeyCloakSettings__Proxy=false
      - DareAPISettings__Address=http://submissionAPI:8080
      - DareAPISettings_HelpAddress=http://submissionAPI:8080
      - FormIOSettings__UseInternal=true
      - sslcookies=${sslcookies}
      - httpsRedirect=${httpsRedirect}
      - SuppressAntiforgery=${SuppressAntiforgery}
      - URLSettingsFrontEnd__QueryImageSQL=${URLSettingsFrontEndQueryImageSQL}
      - URLSettingsFrontEnd__S3BaseUrl=${SubmissionS3ConsoleUrl}
      - URLSettingsFrontEnd__S3BucketPath=/rustfs/console/browser/?bucket=
      # Submission Keycloak settings
      - SubmissionKeyCloakSettings__Proxy=${useproxy}
      - SubmissionKeyCloakSettings__ProxyAddresURL=${proxyurl}
      - SubmissionKeyCloakSettings__BypassProxy="submissionAPI,seq"
      - SubmissionKeyCloakSettings__TokenExpiredAddress=${SubmissionKeyCloakClientUIRedirectURL}/Account/LoginAfterTokenExpired
      - SubmissionKeyCloakSettings__UseRedirectURL=false
      - SubmissionKeyCloakSettings__RedirectURL=${SubmissionKeyCloakClientUIRedirectURL}
      - SubmissionKeyCloakSettings__ClientSecret=${SubmissionUIClientSecret}
      - SubmissionKeyCloakSettings__AccountManagementURL=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/account
      - SubmissionKeyCloakSettings__BaseUrl=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control
      - SubmissionKeyCloakSettings__MetadataAddress=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/.well-known/openid-configuration
      - SubmissionKeyCloakSettings__Authority=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/
    #  To resolve keycloak hostname for local development
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"

  # ----- Submission API -----
  # ----------------------------------

  submissionAPI:
    image: harbor.federated-analytics.ac.uk/5s-tes/submission-api:${DEPLOYMENT_VERSION}
    container_name: submissionAPI
    restart: always
    networks:
      - sub-net
    ports:
      - 5034:8080
    volumes:
      - data-protection:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 5s
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs_submission:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      - Features__SeedDemoData=${SeedDemoData}
      - KeycloakDemoMode=${KeyCloakDemoMode}
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=DARE-Control;User Id=${PGLOGIN};Password=${PGPASSWORD};TrustServerCertificate=True;
      - Serilog__SeqServerUrl=http://seq:5341
      - Serilog__MinimumLevel__Default=${SerilogLevel}
      - Logging__LogLevel__Default=${SerilogLevel}
      - SuppressAntiforgery=${SuppressAntiforgery}
      # RABBITMQ settings
      - RabbitMQ__HostAddress=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=${RabbitMQDefaultPassword}
      # Minio settings
      - MinioSettings__Url=${SubmissionS3ApiUrl}
      - MinioSettings__AdminConsole=${SubmissionS3ConsoleUrl}
      - MinioSettings__AccessKey=${SubmissionS3RootUser}
      - MinioSettings__SecretKey=${SubmissionS3RootPass}
      # Submission Keycloak settings
      - SubmissionKeyCloakSettings__Proxy=${useproxy}
      - SubmissionKeyCloakSettings__ProxyAddresURL=${proxyurl}
      - SubmissionKeyCloakSettings__BypassProxy=rustfs_submission,seq
      - SubmissionKeyCloakSettings__TokenExpiredAddress=${SubmissionKeyCloakClientUIRedirectURL}/Account/LoginAfterTokenExpired
      - SubmissionKeyCloakSettings__UseRedirectURL=false
      - SubmissionKeyCloakSettings__RedirectURL=${SubmissionKeyCloakClientUIRedirectURL}
      - SubmissionKeyCloakSettings__BaseUrl=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control
      - SubmissionKeyCloakSettings__MetadataAddress=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/.well-known/openid-configuration
      - SubmissionKeyCloakSettings__Authority=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/
      - SubmissionKeyCloakSettings__ClientSecret=${SubmissionAPIKeyCloakSecret}
      - SubmissionKeyCloakSettings__SignedOutRedirectUri=${SubmissionSignedOutRedirectUri}
      - SubmissionKeyCloakSettings__TokenRefreshSeconds=${SubmissionTokenRefreshSeconds}
      - SubmissionKeyCloakSettings__ValidAudiences=Dare-Control-UI,Dare-Control-API,Dare-Control-Minio
      - SubmissionKeyCloakSettings__Server=${SubmissionKeyCloakServer}
      - SubmissionKeyCloakSettings__Protocol=${SubmissionServerProtocol}
      - SubmissionKeyCloakSettings__Realm=Dare-Control
      - SubmissionKeyCloakSettings__AutoTrustKeycloakCert=${SubmissionAutoTrustKeycloakCert}
      - SubmissionKeyCloakSettings__ValidIssuer=${SubmissionValidIssuer}
      # Vault settings
      - VaultSettings__BaseUrl=http://vault:8200
      - VaultSettings__Token=${VaultRootToken}
      - VaultSettings__TimeoutSeconds=30
      - VaultSettings__SecretEngine=secret
      - VaultSettings__EnableRetry=true
      - VaultSettings__MaxRetryAttempts=3
      # Keycloak admin API settings
      - KeycloakAdmin__Username=${KeycloakAdmin__Username}
      - KeycloakAdmin__Password=${KeycloakAdmin__Password}
      # TRE onboarding JSON (public URLs reachable from remote TRE / Agent hosts)
      - SubmissionApiUrl=${SubmissionApiUrl}
    #  To resolve keycloak hostname for local development
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"
      - "sub-s3-api.localtest.me:host-gateway"
