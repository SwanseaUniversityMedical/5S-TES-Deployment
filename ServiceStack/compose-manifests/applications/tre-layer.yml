services:
  # ------ TRE Agent - UI -------
  # -----------------------------------

  tre-ui:
    image: harbor.federated-analytics.ac.uk/5s-tes/agent-ui:${DEPLOYMENT_VERSION}
    container_name: treUI
    restart: always
    networks:
      - sub-net
    ports:
      - 8989:8080
    depends_on:
      - tre-api
    environment:
      - UIName__Name=${AppName}
      - TreAPISettings__InternalApiBaseUrl=http://treAPI:8080
      - TreAPISettings__PublicApiBaseUrl=${TreApiPublicUrl}
      - Serilog__SeqServerUrl=http://seq:5341
      - Serilog__MinimumLevel__Default=${SerilogLevel}
      - Logging__LogLevel__Default=${SerilogLevel}
      - KeycloakDemoMode=${KeyCloakDemoMode}
      - sslcookies=${sslcookies}
      - httpsRedirect=${httpsRedirect}
      - TreKeyCloakSettings__AccountManagementURL=${TRE_KEYCLOAK_URL}/realms/Dare-TRE/account
      - TreKeyCloakSettings__Authority=${TRE_KEYCLOAK_URL}/realms/Dare-TRE/.well-known/openid-configuration
      - TreKeyCloakSettings__MetadataAddress=${TRE_KEYCLOAK_URL}/realms/Dare-TRE/.well-known/openid-configuration
      - TreKeyCloakSettings__BaseUrl=${TRE_KEYCLOAK_URL}/realms/Dare-TRE
      - TreKeyCloakSettings__ClientId=Dare-TRE-UI
      - TreKeyCloakSettings__ClientSecret=${TreKeyCloakSecret}
      - TreKeyCloakSettings__ValidAudiences=Dare-TRE-API,Dare-TRE-UI
      - TreKeyCloakSettings__UseRedirectURL=false
      - TreKeyCloakSettings__Proxy=${useproxy}
      - TreKeyCloakSettings__ProxyAddresURL=${proxyurl}
      - TreKeyCloakSettings__BypassProxy="treAPI,seq-tre"
    #  To resolve keycloak hostname for local development
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"

  # ------ TRE Agent - Web (NextJS app) -------
  # -----------------------------------
  agent-web:
    image: harbor.federated-analytics.ac.uk/5s-tes/agent-web:${DEPLOYMENT_VERSION}
    container_name: agent-web
    restart: always
    networks:
      - sub-net
    ports:
      - 3000:3000
    depends_on:
      - tre-api
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - KEYCLOAK_URL=${TRE_KEYCLOAK_URL}
      - KEYCLOAK_CLIENT_ID=Dare-TRE-UI
      - KEYCLOAK_CLIENT_SECRET=${TreKeyCloakSecret}
      - NEXT_PUBLIC_KEYCLOAK_URL=${TRE_KEYCLOAK_URL}
      - NEXT_PUBLIC_KEYCLOAK_REALM=Dare-TRE
      - NEXT_PUBLIC_HELPDESK_URL=https://ukserp.atlassian.net/servicedesk/customer/portal/3
      - AGENT_API_URL=http://treapi:8080
    #  To resolve keycloak hostname for local development
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"

  # ------ TRE Agent - API -------
  # -----------------------------------
  tre-api:
    image: harbor.federated-analytics.ac.uk/5s-tes/agent-api:${DEPLOYMENT_VERSION}
    container_name: treapi
    restart: always
    networks:
      - sub-net
    ports:
      - 8072:8080
    # This is the volume for the process models to make the changes in the DMN table persistent
    volumes:
      - tre_process_models:/app/ProcessModels
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs_TRE:
        condition: service_healthy
      vault:
        condition: service_healthy
      zeebe:
        condition: service_healthy
    environment:
      # General settings
      - Features__SeedDemoData=${SeedDemoData}
      - Features__EphemeralCredentials=true
      - KeycloakDemoMode=${KeyCloakDemoMode}
      - DemoModeDefaultP=${DemoModePassword}
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=DARE-Tre;User Id=${PGLOGIN};Password=${PGPASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__CredentialsConnection=Server=postgres;Port=5432;Database=TRE_Credentials;User Id=${PGLOGIN};Password=${PGPASSWORD};TrustServerCertificate=True;
      - Serilog__SeqServerUrl=http://seq:5341
      - Serilog__MinimumLevel__Default=${SerilogLevel}
      - Logging__LogLevel__Default=${SerilogLevel}
      - ApiEndpoints__SubmissionApiUrl=${SubmissionAPIAddressURL}
      - ApiEndpoints__EgressApiUrl=http://DataEgressAPI:8080
      - Hangfire__Username=${HangfireUser}
      - Hangfire__Password=${HangfirePassword}
      - AgentSettings__UseTESK=${UseTESK}
      - JobSettings__scanSchedule=${scanSchedule}
      - JobSettings__syncSchedule=${syncSchedule}
      - JobSettings__healthCheckSchedule=${healthCheckSchedule}
      - JobSettings__DaysBeforeHealthLogDeletion=${daysBeforeHealthLogDeletion}
      - AgentSettings__TESKAPIURL=${TesAPIUrl}
      - AgentSettings__TESKOutputBucketPrefix=${TesOutputBucketPrefix}
      - TreName=${TreName}
      # RABBITMQ settings
      - RabbitMQ__HostAddress=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=${RabbitMQDefaultPassword}
      # TRE UI Keycloak settings
      - TreKeyCloakSettings__Authority=${TRE_KEYCLOAK_URL}/realms/Dare-TRE/.well-known/openid-configuration
      - TreKeyCloakSettings__MetadataAddress=${TRE_KEYCLOAK_URL}/realms/Dare-TRE/.well-known/openid-configuration
      - TreKeyCloakSettings__BaseUrl=${TRE_KEYCLOAK_URL}/realms/Dare-TRE
      - TreKeyCloakSettings__ClientId=Dare-TRE-UI
      - TreKeyCloakSettings__ClientSecret=${TreKeyCloakSecret}
      - TreKeyCloakSettings__ValidAudiences=Dare-TRE-API,Dare-TRE-UI
      - TreKeyCloakSettings__UseRedirectURL=false
      - TreKeyCloakSettings__Proxy=${useproxy}
      - TreKeyCloakSettings__ProxyAddresURL=${proxyurl}
      - TreKeyCloakSettings__BypassProxy="treAPI,seq-tre"
      # Data Egress Keycloak settings
      - DataEgressKeyCloakSettings__Authority=${TRE_KEYCLOAK_URL}/realms/Data-Egress/.well-known/openid-configuration
      - DataEgressKeyCloakSettings__MetadataAddress=${TRE_KEYCLOAK_URL}/realms/Data-Egress/.well-known/openid-configuration
      - DataEgressKeyCloakSettings__BaseUrl=${TRE_KEYCLOAK_URL}/realms/Data-Egress
      - DataEgressKeyCloakSettings__ClientId=Data-Egress-API
      - DataEgressKeyCloakSettings__ClientSecret=${EgressKeyCloakSecret}
      - DataEgressKeyCloakSettings__ValidAudiences=Data-Egress-UI,Data-Egress-API
      - DataEgressKeyCloakSettings__TokenExpiredAddress=${EgressKeyCloakClientUIRedirectURL}/Account/LoginAfterTokenExpired
      - DataEgressKeyCloakSettings__RedirectURL=${EgressKeyCloakClientUIRedirectURL}
      - DataEgressKeyCloakSettings__UseRedirectURL=false
      - DataEgressKeyCloakSettings__Proxy=${useproxy}
      - DataEgressKeyCloakSettings__ProxyAddresURL=${proxyurl}
      - DataEgressKeyCloakSettings__BypassProxy="DataEgressUI,treAPI,seq-tre"
      # Submission API Keycloak settings
      - SubmissionKeyCloakSettings__Authority=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/.well-known/openid-configuration
      - SubmissionKeyCloakSettings__MetadataAddress=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control/.well-known/openid-configuration
      - SubmissionKeyCloakSettings__BaseUrl=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control
      - SubmissionKeyCloakSettings__ClientId=Dare-Control-API
      - SubmissionKeyCloakSettings__ClientSecret=${SubmissionAPIKeyCloakSecret}
      - SubmissionKeyCloakSettings__ValidAudiences=Dare-Control-UI,Dare-Control-API,Dare-Control-Minio
      - SubmissionKeyCloakSettings__UseRedirectURL=false
      - SubmissionKeyCloakSettings__Proxy=${useproxy}
      - SubmissionKeyCloakSettings__ProxyAddresURL=${proxyurl}
      - SubmissionKeyCloakSettings__BypassProxy="treAPI,seq-tre,minioSubmission"
      # MINIO TRE settings
      - MinioTRESettings__Url=http://rustfs_TRE:9002
      - MinioTRESettings__AccessKey=${TRES3RootUser}
      - MinioTRESettings__SecretKey=${TRES3RootPass}
      - MinioTRESettings__AdminConsole=http://rustfs_TRE:9003
      # MINIO SUBMISSION settings
      - MinioSubSettings__Url=${SubmissionS3ApiUrl}
      # Credentials and DMN settings

      - DmnPath__Path=/app/ProcessModels
      - ApiEndpoints__TreApiUrl=${TreApiPublicUrl}
      # Vault settings
      - VaultSettings__BaseUrl=http://vault:8200
      - VaultSettings__Token=${VaultRootToken}
      - VaultSettings__TimeoutSeconds=30
      - VaultSettings__SecretEngine=secret
      - VaultSettings__EnableRetry=true
      - VaultSettings__MaxRetryAttempts=3
      - VaultSettings__VaultConfigPath=config
      - VaultSettings__VaultConfigReloadInterval=10
      # Zeebe settings
      - ZeebeBootstrap__Client__GatewayAddress=zeebe:26500
      - ZeebeBootstrap__Worker__MaxJobsActive=5
      - ZeebeBootstrap__Worker__TimeoutInMilliseconds=5000
      - ZeebeBootstrap__Worker__PollIntervalInMilliseconds=1000
      - ZeebeBootstrap__Worker__PollingTimeoutInMilliseconds=5000
      - ZeebeBootstrap__Worker__RetryTimeoutInMilliseconds=5000
      # Encryption settings
      - EncryptionSettings__Key=${EncryptionSettingsKey}
      # Onboarding settings
      - TreOnboardingConfig__IsConfigurationImported=false
    #  To resolve keycloak hostname for local development
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"

  # ----- TRE Agent - Camunda Worker -------
  # --------------------------------------------

  TRE-Camunda:
    image: harbor.federated-analytics.ac.uk/5s-tes/credentials-camunda:${DEPLOYMENT_VERSION}
    container_name: TRE-Camunda
    restart: always
    networks:
      - sub-net
    depends_on:
      zeebe:
        condition: service_healthy
      openldap:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
      - tre_process_models:/app/ProcessModels
    environment:
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - AllowedHosts=*
      - Serilog__SeqServerUrl=http://seq:5341
      - Serilog__MinimumLevel__Default=${SerilogLevel}
      - Logging__LogLevel__Default=${SerilogLevel}
      - DmnPath__Path=/app/ProcessModels
      # Zeebe Bootstrap settings
      - ZeebeBootstrap__Client__GatewayAddress=zeebe:26500
      - ZeebeBootstrap__Worker__MaxJobsActive=5
      - ZeebeBootstrap__Worker__TimeoutInMilliseconds=5000
      - ZeebeBootstrap__Worker__PollIntervalInMilliseconds=1000
      - ZeebeBootstrap__Worker__PollingTimeoutInMilliseconds=5000
      - ZeebeBootstrap__Worker__RetryTimeoutInMilliseconds=5000
      # LDAP settings
      - LdapSettings__Host=openldap
      - LdapSettings__Port=389
      - LdapSettings__AdminDn=cn=admin,dc=camundaephemeral,dc=local
      - LdapSettings__AdminPassword=${LDAPAdminPassword}
      - LdapSettings__BaseDn=dc=camundaephemeral,dc=local
      - LdapSettings__UserOu=ou=Users
      - LdapSettings__UseSSL=false
      # Vault settings
      - VaultSettings__BaseUrl=http://vault:8200
      - VaultSettings__Token=${VaultRootToken}
      - VaultSettings__TimeoutSeconds=30
      - VaultSettings__SecretEngine=secret
      - VaultSettings__EnableRetry=true
      - VaultSettings__MaxRetryAttempts=3
      - ConnectionStrings__CredentialsConnection=Server=postgres;Port=5432;Database=TRE_Credentials;User Id=${PGLOGIN};Password=${PGPASSWORD};
      - ConnectionStrings__TREPostgresConnection=Server=${TRE_DATA_SERVER};Port=${TRE_DATA_PORT};Database=${TRE_DATA_DATABASE};User Id=${TRE_DATA_USER};Password=${TRE_DATA_PASSWORD};
